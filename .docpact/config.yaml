# Review note, 2026-09-05: #100 adopts provenance-verified CLI 0.1.10 and its public runtime boundary; current dependency/test/runtime/doc routes cover the change without moving task or mutation authority.
# Review note, 2026-09-04: #97 uses existing auth/runtime/test governance for the OAuth consumer and isolated Golden snapshots; CLI owns session/transport and #270 tracks support-cache extraction.
# Review note, 2026-06-04: first-pass docpact onboarding for Foundry thin-control-plane refactor.
# Review note, 2026-07-23: Issue #42 adds the generic offline incremental change-set composer, exact per-conversion event ledger, and CLI candidate contract. Strict Draft 2020-12 validation uses the exact Ajv 8.20.0 runtime dependency; evidence-bound entity/path/value rules, stable-identity array handling, snapshot receipts, terminal pairs, and non-root field allowlists add no remote access or mutation authority.
# Review note, 2026-07-24: Issue #47 adds the offline topology-convergence F/P/D composer. Candidate topology, fresh owner/public/foreign census, audited classifications, occurrence-keyed multilingual preservation, fixed CLI fingerprint, zero-inbound delete candidates, and hash-chained logs remain local planning evidence with no DML authority.
# Review note, 2026-07-27: Issue #50's Rust tidas cutover adds an explicit self-governance rule for retained Python-era import plans so they cannot silently regain executable authority.
# Review note, 2026-07-30: Issue #54 aligns identity-preflight requests to one lexical_weight plus semantic_weight without changing Foundry ownership or remote mutation authority.
# Review note, 2026-08-25: Issue #63 establishes the pnpm 11.23 / Node 24 / TypeScript 7.0.2 typed spine, explicit JavaScript migration inventory, Oxlint boundary, CLI 0.1.0 command pin, and clean arbitrary-worktree validation. Existing ownership and routing semantics are unchanged.
# Review note, 2026-08-25: Issue #65 removes the foreign/RLS-hidden state-0 missing-dataset accepted-diff path from the helper, shared batch runner, and worldsteel config; legitimate root traceHash-only normalization remains, and the touched helper/test migrate to TypeScript.
# Review note, 2026-08-25: Issue #65 adds the typed CommandSpec envelope, authoritative executable/argv handoffs, final-row byte/SHA binding, and shell-free BAFU execution. Ownership and routing semantics are unchanged.
# Review note, 2026-08-25: Issue #67 Wave 24 B3 migrates the curation aggregate, gate runner, and cleanup runner under the existing scripts/** and test/** ownership/rule coverage. No catalog, routing, rule, profile, environment, or remote-authority semantics change.
# Review note, 2026-08-25: Issue #67 Wave 24 migrates five existing command-owner paths to TypeScript with local characterization. Existing control-plane, test-layout, ownership, and documentation routes already cover the moved paths; no rule or authority boundary changes.
# Review note, 2026-08-26: Issue #68 adds a narrow Worldsteel wrapper/test/document route to the profile index, current docs, and retained evidence. The monolithic specs/import-profiles.json stays under the generic import-profile trigger so unrelated profile edits do not fan out to Worldsteel; the executable truth test is the cross-file backstop for its Worldsteel subtree.
# Review note, 2026-08-26: Issue #69 adds a narrow strict prewrite-datetime route across bundle preservation, atomic cleanup blockers, non-destructive stale-artifact reporting, finalize short-circuiting, CLI exit behavior, and their focused contracts. It also closes the existing control-plane coverage gap for specs/prewrite-content-policy.json without changing ownership or mutation authority.
# Review note, 2026-08-29: Issue #70 governs high-level orchestration decomposition, shrink-only module budgets, and AI navigation. The batch post-write handoff and scope-finalize/commit extractions preserve artifact-bound CLI execution, idempotent conflict handling, bounded readback retries, support reuse/invalidation, patch recovery, and closeout without changing remote authority.
# Review note, 2026-08-29: Issue #82 updates only the exact pnpm toolchain pin to 11.24.0. Existing bootstrap, control-plane, test-layout, workflow, and governed-doc rules already cover the manifest, sole root lock, CI, toolchain test, and active guidance; no ownership, routing, dependency, runtime, command, or authority rule changes.
# Review note, 2026-08-29: Issue #70 pins provenance-verified CLI 0.1.3, consumes batch/run-lock and auth receipt parsing through supported package subpaths, centralizes deterministic test-only receipt bytes, and ratchets private `dist/src/**` imports to zero. Existing orchestration, account, test-layout, bootstrap, and control-plane rules cover the change without widening remote authority.
# Review note, 2026-08-29: Issue #70 also re-reviews the Worldsteel profile family after its operational CLI-version update. The machine profile timestamp and all four governed documents move together; R1-R5, retained counts, cache-miss policy, support ordering, and production authority remain unchanged.
# Review note, 2026-08-29: Issue #70 replaces the remaining manual scope claim loop with a 166-line Foundry adapter over public CLI batch/run-lock. Existing orchestration rules now cover contract projection, family resource FIFO, pause/stop/drain, the 1,898-line owner, focused boundary cases, and unchanged semantic ledger/report authority.
# Review note, 2026-08-29: Issue #70 makes the batch public owner a five-line facade and moves the 1,649-line composition root to an explicitly named/budgeted lib path. This preserves the same three exports, help, profile adapters, semantic modules, CLI delegation, and authority while keeping residual composition density visible.
