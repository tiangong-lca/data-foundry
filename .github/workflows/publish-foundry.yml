name: Foundry Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      diagnose_npm_oidc:
        description: Inspect redacted npm OIDC response validation only; never publish
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: foundry-release
  cancel-in-progress: false

jobs:
  diagnose-npm-oidc:
    name: Diagnose npm OIDC without publication
    if: github.repository == 'tiangong-lca/data-foundry' && github.event_name == 'workflow_dispatch' && inputs.diagnose_npm_oidc
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.19.0
          install: false
          cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Report fixed validation facts and discard the credential
        run: pnpm release:diagnose-npm-oidc

  release-context:
    name: Exact release context
    if: github.repository == 'tiangong-lca/data-foundry' && !(github.event_name == 'workflow_dispatch' && inputs.diagnose_npm_oidc)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_release: ${{ steps.context.outputs.should_release }}
      release_head: ${{ steps.context.outputs.release_head }}
      release_base: ${{ steps.context.outputs.release_base }}
      version: ${{ steps.context.outputs.version }}
      tag: ${{ steps.context.outputs.tag }}
      release_pr: ${{ steps.context.outputs.release_pr }}
    steps:
      - name: Check out the event commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refresh main ancestry
        run: git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.19.0
          install: false
          cache: false

      - name: Verify event, release diff and merged PR
        id: context
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm release:context --github-output

  release-qualification:
    name: Qualify the exact source on all supported hosts
    needs: release-context
    if: ${{ !cancelled() && needs.release-context.result == 'success' && needs.release-context.outputs.should_release == 'true' }}
    uses: ./.github/workflows/quality-gate.yml
    with:
      source_sha: ${{ needs.release-context.outputs.release_head }}

  release-tag:
    name: Preserve the immutable qualified release tag
    needs:
      - release-context
      - release-qualification
    if: ${{ !cancelled() && needs.release-context.result == 'success' && needs.release-qualification.result == 'success' && needs.release-context.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out the qualified source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.release_head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refresh main ancestry
        run: git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.19.0
          install: false
          cache: false

      - name: Revalidate source and create or verify its tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm release:tag

  npm-package:
    name: Publish the verified npm package
    needs:
      - release-context
      - release-qualification
      - release-tag
    if: ${{ !cancelled() && needs.release-context.result == 'success' && needs.release-qualification.result == 'success' && needs.release-tag.result == 'success' && needs.release-context.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      npm_published: ${{ steps.publish.outputs.npm_published }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Check out the qualified source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.release_head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refresh main ancestry
        run: git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.19.0
          install: false
          cache: false

      - name: Install frozen build and signature dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the package verified by source qualification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foundry-ci-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundry-ci-package

      - name: Sign the exact package verified by source qualification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FOUNDRY_CI_PACKAGE_DIR: ${{ runner.temp }}/foundry-ci-package
          FOUNDRY_CI_PACKAGE_MANIFEST_SHA256: ${{ needs.release-qualification.outputs.package_manifest_sha256 }}
          FOUNDRY_CI_PACKAGE_SHA256: ${{ needs.release-qualification.outputs.package_sha256 }}
        run: pnpm release:prepare-package

      - name: Preserve the signed package and first-publication handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundry-npm-${{ needs.release-context.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-artifacts/npm-release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish with short-lived OIDC and verify public registry evidence
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm release:publish-package

      - name: Preserve the publication result and public verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundry-publication-${{ needs.release-context.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: package-artifacts/npm-publication/
          if-no-files-found: warn
          retention-days: 30

  prepare-runtime:
    name: Prepare published runtime (${{ matrix.platform }})
    needs:
      - release-context
      - release-qualification
      - npm-package
    if: ${{ !cancelled() && needs.release-context.result == 'success' && needs.release-qualification.result == 'success' && needs.npm-package.result == 'success' && needs.npm-package.outputs.npm_published == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64
    steps:
      - name: Checkout the qualified release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.release_head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.19.0
          install: false
          cache: true

      - name: Install frozen release dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the package verified by source qualification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foundry-ci-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundry-ci-package

      - name: Assemble and qualify actual public npm and native inputs
        env:
          FOUNDRY_CI_PACKAGE_DIR: ${{ runner.temp }}/foundry-ci-package
          FOUNDRY_CI_PACKAGE_MANIFEST_SHA256: ${{ needs.release-qualification.outputs.package_manifest_sha256 }}
          FOUNDRY_CI_PACKAGE_SHA256: ${{ needs.release-qualification.outputs.package_sha256 }}
        run: pnpm release:prepare-runtime --output "${{ runner.temp }}/foundry-published-runtime" --published

      - name: Attest exact runtime component archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/foundry-published-runtime/components/*.tar.gz

      - name: Preserve the qualified published-input platform
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundry-published-${{ github.run_attempt }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/foundry-published-runtime/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish-components:
    name: Publish immutable runtime components
    needs:
      - release-context
      - prepare-runtime
    if: ${{ !cancelled() && needs.release-context.result == 'success' && needs.prepare-runtime.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      components_published: ${{ steps.publish.outputs.components_published }}
      manifest_sha256: ${{ steps.publish.outputs.manifest_sha256 }}
      candidate_url: ${{ steps.publish.outputs.candidate_url }}
    permissions:
      contents: write
      pull-requests: read
      attestations: read
    steps:
      - name: Checkout the qualified release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.release_head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refresh main ancestry
        run: git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.19.0
          install: false
          cache: true

      - name: Install frozen release dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download qualified linux-x64 from this attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foundry-published-${{ github.run_attempt }}-linux-x64
          path: ${{ runner.temp }}/foundry-published-platforms/linux-x64

      - name: Download qualified linux-arm64 from this attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foundry-published-${{ github.run_attempt }}-linux-arm64
          path: ${{ runner.temp }}/foundry-published-platforms/linux-arm64

      - name: Download qualified darwin-arm64 from this attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foundry-published-${{ github.run_attempt }}-darwin-arm64
          path: ${{ runner.temp }}/foundry-published-platforms/darwin-arm64

      - name: Download qualified win32-x64 from this attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foundry-published-${{ github.run_attempt }}-win32-x64
          path: ${{ runner.temp }}/foundry-published-platforms/win32-x64

      - name: Verify archive source attestations before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_HEAD: ${{ needs.release-context.outputs.release_head }}
        run: |
          for archive in "$RUNNER_TEMP"/foundry-published-platforms/*/components/*.tar.gz; do
            gh attestation verify "$archive" --repo tiangong-lca/data-foundry --signer-workflow tiangong-lca/data-foundry/.github/workflows/publish-foundry.yml --source-digest "$RELEASE_HEAD" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done

      - name: Aggregate and publish exact component assets
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm release:publish-components

      - name: Preserve component publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundry-components-publication-${{ github.run_attempt }}
          path: package-artifacts/runtime-publication/
          if-no-files-found: warn
          retention-days: 30

  qualify-bootstrap-public:
    name: Qualify public bootstrap (${{ matrix.platform }})
    needs:
      - release-context
      - publish-components
    if: ${{ !cancelled() && needs.release-context.result == 'success' && needs.publish-components.result == 'success' && needs.publish-components.outputs.components_published == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64
    steps:
      - name: Checkout the qualified release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.release_head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh main ancestry
        run: git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.19.0
          install: false
          cache: true
      - name: Install frozen qualification dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download independently selected publication metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foundry-components-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundry-bootstrap-public-input
      - name: Qualify actual public downloads through the original bootstrap
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.publish-components.outputs.manifest_sha256 }}
          BOOTSTRAP_INPUT: ${{ runner.temp }}/foundry-bootstrap-public-input
          BOOTSTRAP_OUTPUT: ${{ runner.temp }}/foundry-bootstrap-public-qualification
        run: pnpm release:qualify-bootstrap --input "$BOOTSTRAP_INPUT" --manifest-sha256 "$EXPECTED_MANIFEST_SHA256" --output "$BOOTSTRAP_OUTPUT" --public
      - name: Preserve public native bootstrap evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundry-bootstrap-public-${{ github.run_attempt }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/foundry-bootstrap-public-qualification/bootstrap-qualification.json
          if-no-files-found: error
          retention-days: 30

  publish-runtime-manifest:
    name: Publish the fully qualified runtime manifest
    needs:
      - release-context
      - publish-components
      - qualify-bootstrap-public
    if: ${{ !cancelled() && needs.release-context.result == 'success' && needs.publish-components.result == 'success' && needs.qualify-bootstrap-public.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout the qualified release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.release_head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh main ancestry
        run: git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.19.0
          install: false
          cache: true
      - name: Install frozen publication dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download exact publication inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foundry-components-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundry-manifest-publication-input

      - name: Download linux-x64 public-bootstrap proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foundry-bootstrap-public-${{ github.run_attempt }}-linux-x64
          path: ${{ runner.temp }}/foundry-public-bootstrap-reports/linux-x64

      - name: Download linux-arm64 public-bootstrap proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foundry-bootstrap-public-${{ github.run_attempt }}-linux-arm64
          path: ${{ runner.temp }}/foundry-public-bootstrap-reports/linux-arm64

      - name: Download darwin-arm64 public-bootstrap proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foundry-bootstrap-public-${{ github.run_attempt }}-darwin-arm64
          path: ${{ runner.temp }}/foundry-public-bootstrap-reports/darwin-arm64

      - name: Download win32-x64 public-bootstrap proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: foundry-bootstrap-public-${{ github.run_attempt }}-win32-x64
          path: ${{ runner.temp }}/foundry-public-bootstrap-reports/win32-x64

      - name: Revalidate every native proof and publish the final immutable contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.publish-components.outputs.manifest_sha256 }}
        run: pnpm release:publish-runtime-manifest
      - name: Preserve final manifest publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundry-runtime-manifest-publication-${{ github.run_attempt }}
          path: package-artifacts/runtime-manifest-publication/
          if-no-files-found: warn
          retention-days: 30
